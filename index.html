<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>el-pollo-loco</title>

    <link rel="icon" href="./img/7_statusbars/3_icons/icon_coin.png" type="image/png" />

    <link rel="stylesheet" href="./style.css" />

    <script src="./script.js"></script>

    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./models/throwable-object.classes.js"></script>
    <script src="./models/status-bar.class.js"></script>

    <script src="./models/background-object.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/collectable-object.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/coins.class.js"></script>

    <script src="./models/level.class.js"></script>
    <script src="./levels/level1.js"></script>

    <script src="./models/keyboard.class.js"></script>

    <script src="./js/game.js"></script>
  </head>
  <body onload="init()">
    <nav class="navbar">
      <button onclick="enterFullScreen()"><img class="control-icons" src="./img/fullscreen.png" alt="fullscreen"></button>
      <button onclick="toggleGameVolume()"><img id="volumeBtn" class="control-icons" src="./img/volume-on.png" alt="sound"></button>
      <button><img class="control-icons" src="./img/information.png" alt="info"></button>
    </nav>
    <canvas id="canvas" width="720" height="480"></canvas>

    <div class="controls">
      <div class="control">
        <p class="control-item"><img src="./img/arrow-right.png" alt="arrowRight">: Move Right</p>
        <p class="control-item"><img src="./img/arrow-left.png" alt="arrowLeft">: Move Left</p>
      </div>
      <div class="control">
        <p class="control-item"><strong style="margin-right: 16px;">Space:</strong>Jump</p>
        <p class="control-item"><strong style="margin-right: 16px;">D:</strong>Attack</p>
      </div>
    </div>

  </body>
</html>
